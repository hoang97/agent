template: data
title: Xử lý dữ liệu
description: Lọc, đếm, nhóm kết quả công cụ đã lưu ở server mà không gọi lại hệ thống; script Python trong sandbox khi bộ lọc không đủ.
ping: data:ping
tools:
  - name: query
    description: >-
      Lọc kết quả lớn đã lưu (result_id) mà không gọi lại hệ thống. Tham số giống _filter: path, where [{field, op, value}]
      (op: eq ne contains icontains regex gt gte lt lte exists in), fields, group_by, sort ("-field" để giảm dần), limit, max_chars.
    handler: data:query
    action_class: read
    data_sensitivity: internal
    untrusted_output: true
    local: true
    input_schema:
      properties:
        result_id: {type: string}
        path: {type: string}
        where: {type: array, items: {type: object}}
        fields: {type: array, items: {type: string}}
        group_by: {type: string}
        sort: {type: string}
        limit: {type: integer}
        max_chars: {type: integer}
      required: [result_id]

  - name: script
    description: >-
      Chạy script Python ngắn trên các kết quả đã lưu khi bộ lọc không đủ (ví dụ trích request_id bằng regex rồi đếm).
      Biến inputs là dict {result_id: dữ liệu}; gán kết quả cần trả về vào biến result. Không có mạng, file hay tiến trình con;
      giới hạn CPU, RAM và kích thước đầu ra. Luôn cần người duyệt.
    handler: data:script
    action_class: exec
    reversible: "n/a"
    blast_radius: object
    data_sensitivity: internal
    untrusted_output: true
    local: true
    rollback_hint: Không tác động hệ thống; chỉ đọc dữ liệu đã lưu
    input_schema:
      properties:
        result_ids: {type: array, items: {type: string}}
        code: {type: string}
      required: [result_ids, code]

  - name: propose_tool
    description: >-
      Đề xuất một công cụ chuẩn hóa để dùng lại cách lấy và lọc dữ liệu vừa làm hiệu quả. steps là danh sách
      {tool, args}: bước lấy dữ liệu với _filter cố định; giá trị thay đổi giữa các lần dùng viết là {{tên_tham_số}} và khai trong params
      ({tên: {type: string|integer, description}}); bước data.query/data.script đọc kết quả bước trước bằng result_id/result_ids là "{{step:N}}".
      Công cụ ở trạng thái đề xuất, người có quyền xem các bước rồi mới bật. scope: user (riêng bạn) hoặc tenant (cả nhóm, admin duyệt).
    handler: data:propose_tool
    action_class: write
    reversible: "yes"
    blast_radius: object
    data_sensitivity: internal
    local: true
    rollback_hint: Từ chối hoặc tắt công cụ ở trang Công cụ & Chính sách
    input_schema:
      properties:
        name: {type: string}
        description: {type: string}
        steps: {type: array, items: {type: object}}
        params: {type: object}
        scope: {type: string, enum: [user, tenant]}
      required: [name, description, steps]
