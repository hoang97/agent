template: k8s
title: Kubernetes
description: "API server Kubernetes, xác thực bằng token ServiceAccount hoặc file kubeconfig. Công cụ kubectl_* chạy bằng ServiceAccount riêng theo nhóm quyền đọc/ghi/quản trị, do kagent tạo từ tài khoản này (cần quyền tạo ServiceAccount và RBAC)."
ping: k8s:ping
validate: k8s:validate_params
fields:
  - {name: kubeconfig, type: secret_text, description: "Nội dung kubeconfig có nhúng sẵn chứng chỉ, xuất bằng: kubectl config view --raw --minify --flatten. Dùng được token hoặc chứng chỉ client; không hỗ trợ exec/auth-provider"}
  - {name: context, type: string, description: "Context trong kubeconfig; để trống thì dùng current-context"}
  - {name: api_url, type: url, description: "Địa chỉ API server, ví dụ https://k8s.example.com:6443; bắt buộc nếu không có kubeconfig, điền thì thay server trong kubeconfig"}
  - {name: token, type: secret, description: "Token của ServiceAccount; bắt buộc nếu không có kubeconfig, điền thì thay thông tin xác thực trong kubeconfig"}
  - {name: ca_cert, type: text, description: Chứng chỉ CA dạng PEM nếu cụm dùng CA riêng}
  - {name: verify_tls, type: boolean, default: true, description: Kiểm tra chứng chỉ TLS}
  - {name: namespace, type: string, default: default, description: Namespace mặc định}
  - {name: allowed_namespaces, type: list, description: "Chỉ cho phép các namespace này, cách nhau dấu phẩy; để trống là không giới hạn"}
  - {name: max_replicas, type: integer, default: 50, description: Số replica tối đa khi scale}
tools:
  - name: list_pods
    description: Liệt kê pod trong một namespace kèm trạng thái và số lần restart
    handler: k8s:list_pods
    action_class: read
    blast_radius: namespace
    data_sensitivity: internal
    input_schema:
      properties:
        namespace: {type: string}

  - name: list_deployments
    description: Liệt kê deployment trong một namespace kèm số replica và image
    handler: k8s:list_deployments
    action_class: read
    blast_radius: namespace
    data_sensitivity: internal
    input_schema:
      properties:
        namespace: {type: string}

  - name: pod_logs
    description: Đọc các dòng log cuối của một pod
    handler: k8s:pod_logs
    action_class: read
    blast_radius: object
    data_sensitivity: personal
    untrusted_output: true
    input_schema:
      properties:
        namespace: {type: string}
        pod: {type: string}
        container: {type: string}
        tail_lines: {type: integer}
      required: [pod]

  - name: scale
    description: Đổi số replica của một deployment
    handler: k8s:scale
    check: k8s:scale_check
    action_class: write
    reversible: "yes"
    blast_radius: workload
    data_sensitivity: internal
    dry_run: server
    rollback_hint: Scale lại về số replica cũ
    input_schema:
      properties:
        namespace: {type: string}
        deployment: {type: string}
        replicas: {type: integer}
      required: [deployment, replicas]

  - name: rollout_restart
    description: Khởi động lại các pod của deployment theo kiểu rollout
    handler: k8s:rollout_restart
    check: k8s:restart_check
    action_class: write
    reversible: partial
    blast_radius: workload
    data_sensitivity: internal
    dry_run: server
    rollback_hint: kubectl rollout undo về revision trước
    input_schema:
      properties:
        namespace: {type: string}
        deployment: {type: string}
      required: [deployment]

  - name: delete_pod
    description: Xóa một pod (controller sẽ tạo lại pod mới)
    handler: k8s:delete_pod
    check: k8s:delete_pod_check
    action_class: destructive
    reversible: partial
    blast_radius: object
    data_sensitivity: internal
    dry_run: server
    rollback_hint: Controller tự tạo lại pod; pod không có controller thì mất hẳn
    input_schema:
      properties:
        namespace: {type: string}
        pod: {type: string}
      required: [pod]

  - name: exec
    description: Chạy một lệnh trong container của pod (ví dụ psql -c "SELECT 1")
    handler: k8s:exec_command
    action_class: exec
    reversible: "no"
    blast_radius: workload
    data_sensitivity: internal
    untrusted_output: true
    input_schema:
      properties:
        namespace: {type: string}
        pod: {type: string}
        container: {type: string}
        command: {type: string, description: Lệnh và tham số, tách theo quy tắc shell}
        timeout_seconds: {type: integer}
      required: [pod, command]

  # Ba công cụ kubectl chạy bằng ServiceAccount riêng của từng nhóm quyền, do kagent tạo trong cụm (Công cụ → Kết nối → Quyền Kubernetes).
  # RBAC của cụm là giới hạn thật; mức rủi ro của công cụ khớp với nhóm quyền nên không cần đọc lệnh để đoán.
  - name: kubectl_read
    description: "Chạy lệnh kubectl chỉ đọc (get, describe, logs, top, events, explain, auth can-i, rollout status/history...) bằng quyền nhóm đọc. Ví dụ command: get pods -n app -o wide"
    handler: kubectl:run_read
    action_class: read
    blast_radius: cluster
    data_sensitivity: personal
    untrusted_output: true
    input_schema:
      properties:
        command: {type: string, description: "Lệnh kubectl không kèm chữ kubectl, flag đặt sau lệnh con, flag ngắn viết tách (-n app)"}
        timeout_seconds: {type: integer}
      required: [command]

  - name: kubectl_write
    description: "Chạy lệnh kubectl thay đổi tài nguyên (apply, create, patch, replace, label, annotate, scale, set, rollout restart/undo, cordon...) bằng quyền nhóm ghi; không xóa được. Luôn chạy thử --dry-run=server trước"
    handler: kubectl:run_write
    check: kubectl:check_write
    action_class: write
    reversible: partial
    blast_radius: namespace
    data_sensitivity: internal
    dry_run: server
    untrusted_output: true
    rollback_hint: "Áp lại manifest cũ, hoặc kubectl rollout undo với deployment"
    input_schema:
      properties:
        command: {type: string, description: "Lệnh kubectl không kèm chữ kubectl, ví dụ: apply -f - hoặc scale deploy/web --replicas=3 -n app"}
        manifest: {type: string, description: "Nội dung YAML/JSON khi lệnh có -f -"}
        timeout_seconds: {type: integer}
      required: [command]

  - name: kubectl_admin
    description: "Chạy lệnh kubectl bất kỳ trong phạm vi nhóm quản trị (delete, drain, exec, run, certificate approve và mọi lệnh của nhóm ghi, đọc). Luôn cần duyệt"
    handler: kubectl:run_admin
    check: kubectl:check_admin
    action_class: destructive
    reversible: "no"
    blast_radius: cluster
    data_sensitivity: secret
    dry_run: server
    untrusted_output: true
    rollback_hint: "Tạo lại tài nguyên từ manifest đã lưu; object đã xóa không tự khôi phục"
    input_schema:
      properties:
        command: {type: string, description: "Lệnh kubectl không kèm chữ kubectl, ví dụ: delete pod web-0 -n app hoặc exec web-0 -n app -- env"}
        manifest: {type: string, description: "Nội dung YAML/JSON khi lệnh có -f -"}
        timeout_seconds: {type: integer}
      required: [command]
