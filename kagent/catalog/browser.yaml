server: mcp-browser
description: Trình duyệt (backend mô phỏng, không gọi mạng thật)
defaults:
  envs: [dev, staging, prod]
  roles: [member]
tools:
  - name: browser.read
    description: Đọc nội dung trang web
    handler: sim:browser_read
    action_class: read
    reversible: n/a
    blast_radius: object
    data_sensitivity: internal
    untrusted_output: true
    annotations: {readOnlyHint: true, openWorldHint: true}
    input_schema:
      properties:
        url: {type: string}
      required: [url]

  - name: browser.submit_form
    description: Điền và gửi form
    handler: sim:browser_submit
    action_class: external_send
    reversible: "no"
    blast_radius: object
    data_sensitivity: internal
    rollback_hint: Không thể hoàn tác
    annotations: {openWorldHint: true}
    input_schema:
      properties:
        url: {type: string}
        fields: {type: object}
      required: [url]
