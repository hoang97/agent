server: mcp-kibana
description: Kibana / Elasticsearch (backend mô phỏng)
defaults:
  envs: [dev, staging, prod]
  roles: [member]
tools:
  - name: kibana.search
    description: Tìm log; log có thể chứa dữ liệu cá nhân
    handler: sim:kibana_search
    action_class: read
    reversible: n/a
    blast_radius: namespace
    data_sensitivity: personal
    untrusted_output: true
    annotations: {readOnlyHint: true, openWorldHint: true}
    input_schema:
      properties:
        query: {type: string}
      required: [query]

  - name: es.delete_index
    description: Xóa index Elasticsearch
    handler: sim:es_delete_index
    action_class: destructive
    reversible: "no"
    blast_radius: object
    data_sensitivity: internal
    rollback_hint: Khôi phục từ snapshot
    annotations: {destructiveHint: true}
    input_schema:
      properties:
        index: {type: string}
      required: [index]
